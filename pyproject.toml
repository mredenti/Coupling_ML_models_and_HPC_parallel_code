[project]
name = "mlhpc-model-tools"
version = "0.1.0"
description = "Model export tools for the ML/HPC coupling harness"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.5.1+cpu",
    "numpy==1.26.4",
    "onnx==1.20.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true